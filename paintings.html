  <style>
    #gallery {
      max-width: none;
      padding-inline: 0;
    }

    .painting-wall {
      columns: 4;
      column-gap: clamp(12px, 3vw, 36px);
      padding: clamp(16px, 4vw, 48px);
      background: #DBD1CD;
    }

    .painting-frame {
      /* Atomic items prevent frame shadows fragmenting across Safari columns. */
      display: inline-block;
      vertical-align: top;
      -webkit-column-break-inside: avoid;
      box-sizing: border-box;
      width: 100%;
      height: auto;
      margin: 0 auto clamp(16px, 3vw, 36px);
      border: calc(5px + clamp(5px, 1.2vw, 16px)) solid var(--frame-color, #E6E6E6);
      box-shadow: 3px 5px 10px #38261930;
      break-inside: avoid;
    }

    .painting-frame img {
      display: block;
      width: 100%;
      height: auto;
    }

    .painting-frame:nth-child(3n + 2) {
      width: 85%;
    }

    @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
      .painting-frame {
        transform-origin: 50% 12%;
        transition: transform 350ms cubic-bezier(.2, .7, .2, 1),
                    box-shadow 350ms ease;
      }

      .painting-frame:hover {
        position: relative;
        z-index: 1;
        box-shadow: 4px 9px 15px #38261945;
      }

      /* Different gestures repeat across the wall. */
      .painting-frame:nth-child(4n + 1):hover {
        transform: translateY(-3px) rotate(-2deg);
      }

      .painting-frame:nth-child(4n + 2):hover {
        transform: translateY(-3px) rotate(2deg);
      }

      .painting-frame:nth-child(4n + 3):hover {
        transform: translateY(-5px) scale(1.025);
        transform-origin: center;
      }

      .painting-frame:nth-child(4n):hover {
        animation: painting-sway 700ms ease-in-out;
      }

      @keyframes painting-sway {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(-2deg); }
        55% { transform: rotate(1.5deg); }
        80% { transform: rotate(-.6deg); }
      }
    }

    @media (max-width: 720px) {
      .painting-wall { columns: 2; }
    }
  </style>
</head>
