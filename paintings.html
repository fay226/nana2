  <style>
    .painting-gallery {
      max-width: 1440px;
      margin-inline: auto;
      padding: clamp(24px, 5vw, 70px);
      color: #302820;
    }
    .gallery-heading {
      text-align: center;
      margin: 0 auto clamp(26px, 5vw, 64px);
    }
    .gallery-heading h1 { margin: 14px 0; }
    .gallery-heading > p:last-child { color: #62564c; }
    .gallery-wall {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.23fr) minmax(0, .89fr) minmax(0, 1.08fr);
      align-items: start;
      gap: clamp(12px, 2.7vw, 36px);
      padding: clamp(16px, 4vw, 54px);
      background: #f3efe7;
      border-bottom: 6px solid #ddd5c6;
    }
    .gallery-stack {
      display: grid;
      justify-items: center;
      gap: clamp(15px, 2.8vw, 38px);
      min-width: 0;
    }
    .gallery-stack:nth-child(2) { padding-top: 11%; }
    .gallery-stack:nth-child(4) { padding-top: 18%; }
    .painting-frame {
      --wood: #94754b;
      --mat: #f8f3e7;
      display: block;
      width: 100%;
      padding: clamp(5px, 1.2vw, 16px);
      background: var(--mat);
      border: clamp(3px, .5vw, 7px) ridge var(--wood);
      box-shadow: 3px 5px 10px #38261930;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .painting-frame:nth-child(3n + 2) { width: 85%; }
    .painting-frame[data-frame="walnut"] { --wood: #5f493b; }
    .painting-frame[data-frame="ebony"] { --wood: #3d3730; }
    .painting-frame[data-mat="blue"] { --mat: #d6e1e8; }
    .painting-frame[data-mat="rose"] { --mat: #eddae2; }
    .painting-frame[data-mat="sage"] { --mat: #e0e5d5; }
    .painting-frame[data-mat="gold"] { --mat: #eee2b8; }
    .painting-frame img {
      display: block;
      width: 100%;
      height: auto;
    }
    @media (hover: hover) {
      .painting-frame:hover {
        transform: translateY(-3px);
        box-shadow: 4px 9px 15px #38261940;
      }
    }
    .painting-frame:focus-visible { outline-offset: 4px; }
    .gallery-return { margin: 28px 0 0; text-align: center; }
    .painting-viewer {
      width: min(90vw, 850px);
      max-height: 90dvh;
      padding: clamp(12px, 3vw, 28px);
      color: #302820;
      background: #fffaf1;
      border: 1px solid #c6b8a6;
    }
    .painting-viewer::backdrop { background: #241b16cc; }
    .painting-viewer form, .viewer-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .painting-viewer h2 { margin: 0; font-size: clamp(19px, 3vw, 29px); }
    .painting-viewer button {
      min-height: 44px;
      padding: 4px 10px;
      border: 1px solid #c6b8a6;
      background: #fffaf1;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .painting-viewer img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 65dvh;
      margin: 14px auto;
    }
    @media (max-width: 720px) {
      .gallery-wall { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .gallery-stack:nth-child(4) { padding-top: 8%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .painting-frame { transition: none; }
      .painting-frame:hover { transform: none; }
    }
  </style>

  <script>
    const wall = document.querySelector(".gallery-wall");
    const frames = [...wall.querySelectorAll(".painting-frame")];
    const viewer = document.querySelector(".painting-viewer");
    const image = viewer.querySelector("img");
    const caption = viewer.querySelector("h2");
    let selected = 0;
    let opener;

    function showPainting(index) {
      selected = (index + frames.length) % frames.length;
      const frame = frames[selected];
      image.src = frame.href;
      image.alt = frame.querySelector("img").alt;
      caption.textContent = "Painting " + (selected + 1) + " of " + frames.length;
    }

    wall.addEventListener("click", (event) => {
      const frame = event.target.closest(".painting-frame");
      if (!frame || !viewer.showModal || event.metaKey || event.ctrlKey ||
          event.shiftKey || event.altKey) return;
      event.preventDefault();
      opener = frame;
      showPainting(frames.indexOf(frame));
      viewer.showModal();
    });

    viewer.querySelector("[data-prev]").addEventListener("click", () => showPainting(selected - 1));
    viewer.querySelector("[data-next]").addEventListener("click", () => showPainting(selected + 1));
    viewer.addEventListener("keydown", (event) => {
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      showPainting(selected + (event.key === "ArrowLeft" ? -1 : 1));
    });
    viewer.addEventListener("close", () => opener?.focus());
  </script>
